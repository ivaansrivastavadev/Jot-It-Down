<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jot-It-Down</title>
        <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
        <link rel="stylesheet" href="styles.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
    </head>
    <body>
        <div id="app">
            <div id="topbar">
                <div id="breadcrumb"></div>
                <div id="topbar-actions">
                    <div id="menu-wrapper">
                        <button id="menu-btn">&#8942;</button>
                        <div id="menu-dropdown">
                            <button data-action="global-search">
                                <i class="fa-solid fa-magnifying-glass"></i>
                                global search
                            </button>
                            <hr class="menu-sep" />
                            <button data-action="toggle-hide-completed">
                                <span class="menu-icon">&#10003;</span> hide
                                completed
                            </button>
                            <hr class="menu-sep" />
                            <button data-action="settings">
                                <i class="fa-solid fa-gear"></i> settings
                            </button>
                            <button data-action="version-history">
                                version history
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="outliner"></div>
        </div>

        <div id="search-overlay">
            <input
                id="search-input"
                type="text"
                placeholder="search everything"
                spellcheck="false"
                autocomplete="off"
            />
            <div id="search-results"></div>
        </div>

        <div id="cheatsheet-overlay">
            <div id="cheatsheet-content">
                <h1>keybinds</h1>
                <div class="cheatsheet-grid"></div>
                <button id="cheatsheet-close">close</button>
            </div>
        </div>

        <div id="version-overlay">
            <div id="version-content">
                <h1>version history</h1>
                <div id="version-list"></div>
                <button id="version-close">close</button>
            </div>
        </div>

        <div id="confirm-overlay">
            <div id="confirm-content">
                <div id="confirm-msg">
                    This node has more than 5 nodes. Delete anyway?
                </div>
                <div id="confirm-hint">
                    <span class="key-hint">y</span> /
                    <span class="key-hint">enter</span> /
                    <span class="key-hint">delete</span> to delete &middot;
                    <span class="key-hint">n</span> /
                    <span class="key-hint">backspace</span> to cancel
                </div>
            </div>
        </div>

        <div id="settings-overlay">
            <div id="settings-content">
                <h1>settings</h1>
                <div id="settings-body">
                    <div class="settings-section">
                        <div class="settings-section-title">import</div>
                        <button class="settings-btn" data-action="import-file">
                            import file
                        </button>
                    </div>
                    <div class="settings-section">
                        <div class="settings-section-title">export</div>
                        <button class="settings-btn" data-action="export-text">
                            export plain text (best for humans)
                        </button>
                        <button
                            class="settings-btn"
                            data-action="export-markdown"
                        >
                            export markdown (best for TODOs)
                        </button>
                        <button class="settings-btn" data-action="export-json">
                            export json (best for import/export)
                        </button>
                    </div>
                </div>
                <button id="settings-close">close</button>
            </div>
        </div>

        <div id="import-overlay">
            <div id="import-content">
                <h1>import</h1>
                <div id="import-body">
                    <div id="import-mode-select">
                        <button id="import-replace" data-mode="replace">
                            replace root node
                        </button>
                        <button id="import-append" data-mode="append">
                            append to existing node
                        </button>
                    </div>
                    <div id="import-file-input-section" style="display: none">
                        <input
                            type="file"
                            id="import-file-input"
                            accept=".txt,.json,.md"
                        />
                    </div>
                    <div id="import-node-select" style="display: none">
                        <div id="import-node-list"></div>
                    </div>
                </div>
                <button id="import-close">close</button>
            </div>
        </div>

        <script src="db.js"></script>
        <script src="script.js"></script>
    </body>
</html>
